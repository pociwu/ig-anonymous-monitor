[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-anonymous-monitor"
version = "0.1.0"
description = "Monitor insta-stories-viewer profiles and notify Telegram"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "httpx>=0.27,<1",
  "ImageHash>=4.3,<5",
  "instagrapi==2.18.7",
  "Pillow>=10,<13",
  "playwright>=1.61,<1.62",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "pyotp>=2.9,<3",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ig-monitor = "ig_monitor.cli:main"
ig-monitor-dashboard = "ig_monitor.dashboard:main"
ig-monitor-scheduler = "ig_monitor.scheduler:main"

[tool.setuptools.packages.find]
include = ["ig_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
