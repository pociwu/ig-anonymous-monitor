name: ig-monitor

x-runtime: &runtime
  build:
    context: .
  image: ig-anonymous-monitor:local
  init: true
  user: "${PUID:-1000}:${PGID:-1000}"
  working_dir: /srv/ig-monitor
  environment:
    HOME: /tmp
    IG_MONITOR_RUNTIME: docker
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    PYTHONUNBUFFERED: "1"
    TZ: Asia/Taipei
  restart: unless-stopped

services:
  monitor:
    <<: *runtime
    command:
      - python
      - -m
      - ig_monitor.scheduler
      - --config
      - /srv/ig-monitor/config.yaml
    ipc: host
    environment:
      HOME: /tmp
      IG_MONITOR_RUNTIME: docker
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Taipei
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TELEGRAM_MESSAGE_THREAD_ID: "${TELEGRAM_MESSAGE_THREAD_ID:-}"
      APIFY_API_TOKEN: "${APIFY_API_TOKEN:-}"
    volumes:
      - ./config.yaml:/srv/ig-monitor/config.yaml:ro
      - ./data:/srv/ig-monitor/data
      - ./downloads:/srv/ig-monitor/downloads
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 5m

  relationship-worker:
    <<: *runtime
    command:
      - python
      - -m
      - ig_monitor.relationship_worker
      - --config
      - /srv/ig-monitor/config.yaml
      - --session
      - /srv/ig-monitor/collector-secrets/session.json
    environment:
      HOME: /tmp
      IG_MONITOR_RUNTIME: docker
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Taipei
      IG_COLLECTOR_USERNAME: "${IG_COLLECTOR_USERNAME:-}"
      IG_COLLECTOR_PASSWORD: "${IG_COLLECTOR_PASSWORD:-}"
      IG_COLLECTOR_TOTP_SECRET: "${IG_COLLECTOR_TOTP_SECRET:-}"
    depends_on:
      monitor:
        condition: service_started
    volumes:
      - ./config.yaml:/srv/ig-monitor/config.yaml:ro
      - ./data:/srv/ig-monitor/data
      - ./collector-secrets:/srv/ig-monitor/collector-secrets
    read_only: true
    tmpfs:
      - /tmp

  member-enrichment-worker:
    <<: *runtime
    command:
      - python
      - -m
      - ig_monitor.member_worker
      - --config
      - /srv/ig-monitor/config.yaml
    depends_on:
      monitor:
        condition: service_started
    ipc: host
    volumes:
      - ./config.yaml:/srv/ig-monitor/config.yaml:ro
      - ./data:/srv/ig-monitor/data
      - ./downloads:/srv/ig-monitor/downloads
    read_only: true
    tmpfs:
      - /tmp

  dashboard:
    <<: *runtime
    command:
      - python
      - -m
      - ig_monitor.dashboard
      - --db
      - /srv/ig-monitor/data/state.sqlite3
      - --config
      - /srv/ig-monitor/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "8888"
    depends_on:
      monitor:
        condition: service_started
    ipc: host
    ports:
      - "0.0.0.0:8888:8888"
    volumes:
      - ./config.yaml:/srv/ig-monitor/config.yaml
      - ./data:/srv/ig-monitor/data
      - ./downloads:/srv/ig-monitor/downloads
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
