accounts:
  - url: https://insta-stories-viewer.com/sin_9311/
    enabled: true
    label: sin_9311
    relationship_tracking: true

paths:
  data_dir: ./data
  download_root: ./downloads
  diagnostics_dir: ./data/diagnostics

browser:
  headless: true
  timeout_seconds: 45
  retry_count: 1
  # Use a fixed location so systemd can find Playwright Chromium.
  browsers_path: ./data/ms-playwright

schedule:
  # Docker scheduler waits this many minutes after a completed inspection.
  interval_minutes: 15
  account_delay_min_seconds: 10
  account_delay_max_seconds: 20
  media_limit_per_account: 50

heartbeat:
  enabled: true
  time: "09:00"
  timezone: Asia/Taipei

retention:
  diagnostic_runs: 10
  database_backups: 7

telegram:
  enabled: true
  retry_limit_per_run: 20
  send_new_media: true
  max_new_media_attachments: 10

# API token is kept in .env as APIFY_API_TOKEN, never here.
apify:
  enabled: false
  actor_id: apify/instagram-profile-scraper
  monthly_cap_usd: 5.0
  request_reservation_usd: 0.01
  request_timeout_seconds: 180

media_dedup:
  enabled: true
  image_phash_distance: 4
  aspect_ratio_tolerance_percent: 1.0
  video_duration_tolerance_seconds: 1.0
  video_duration_tolerance_percent: 1.0

# 全域預設關閉；完成 CLI 登入、72 小時觀察及 canary 核准後才開啟。
instagram_enrichment:
  enabled: false
  member_limit_per_direction: 1000
  page_size: 200
  page_delay_min_seconds: 10
  page_delay_max_seconds: 20
  direction_delay_min_seconds: 120
  direction_delay_max_seconds: 300
  daily_relationship_jobs: 6
  minimum_job_interval_minutes: 240
  reconciliation_days: 30
  observation_hours: 72
  canary_days: 7
  daily_member_enrichments: 66
  member_delay_min_seconds: 30
  member_delay_max_seconds: 90
  member_retry_min_hours: 6
  member_stale_days: 30
